<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PedroStation 4</title>
    <meta name="description" content="Portfólio de Pedro Luiz, desenvolvedor de sistemas e estudante de Ciência da Computação na PUC Minas, em uma interface inspirada no PS4."/>
    <meta name="author" content="Pedro Luiz" />

    <!-- Prévia do link (WhatsApp, LinkedIn, Discord etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PedroStation 4" />
    <meta property="og:title" content="PedroStation 4 | Portfólio de Pedro Luiz" />
    <meta property="og:description" content="Portfólio de Pedro Luiz, desenvolvedor de sistemas e estudante de Ciência da Computação na PUC Minas, em uma interface inspirada no PS4." />
    <meta property="og:url" content="https://pedrostation.vercel.app/" />
    <meta property="og:image" content="https://pedrostation.vercel.app/assets/img/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PedroStation 4: Pedro Luiz, Desenvolvedor de Sistemas" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./assets/svg/logo.svg" type="image/svg+xml" />
    <link href="./assets/css/google.css" rel="stylesheet"/>
    <link href="./assets/boxicons.min.css" rel="stylesheet"/>
    <link rel="preload" href="./assets/css/style.min.css" as="style" />
    <link rel="stylesheet" href="./assets/css/style.min.css" />
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/animate.min.css">
  </head>
  <body>
    <img id="imagem" src="./assets/img/start.png" alt="Start">
  <div id="mensagem">
    <span class="soTeclado" data-i18n="idx.aperte">Aperte Start, Espaço ou clique na tela</span>
    <span class="soToque" data-i18n="idx.toque">Toque na tela para começar</span>
  </div>


    <div id="fundoAnimado" hidden>
      <div class='box'>
        <div class='wave -one'></div>
        <div class='wave -two'></div>
        <div class='wave -three'></div>
      </div>
    </div>

    <!-- Seleção de perfil -->
    <section id="telaPerfis" hidden>
      <div class="perfisLogo">
        <img src="./assets/img/logo.png" alt="">
        <span>PedroStation 4</span>
      </div>

      <div class="perfisConteudo animated fadeIn">
        <h1 class="perfisTitulo" data-i18n="idx.bemvindo">Bem-vindo de volta ao PedroStation</h1>
        <p class="perfisSubtitulo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 6h9A5.5 5.5 0 0 1 22 11.5V16a3 3 0 0 1-5.4 1.8L15 16H9l-1.6 1.8A3 3 0 0 1 2 16v-4.5A5.5 5.5 0 0 1 7.5 6Zm-.5 3v1.5H5.5v1.5H7v1.5h1.5V12H10v-1.5H8.5V9H7Zm9.5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm-2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm4 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm-2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg> <span data-i18n="idx.sub">Portifólio online FOLIOSHOCK™4 conectado.<br>
          Seja bem vindo ao meu portfólio. Selecione uma das opções para entrar.</span>
        </p>

        <div class="perfisLista">
          <button class="perfil" data-perfil="sobre">
            <img class="perfilAvatar" src="./assets/img/profile.png" alt="">
            <span class="perfilNome" data-i18n="perfil.sobre">Sobre mim</span>
          </button>
          <button class="perfil" data-perfil="portfolio">
            <img class="perfilAvatar" src="./assets/img/profile.png" alt="">
            <span class="perfilNome" data-i18n="perfil.portfolio">Portfólio</span>
          </button>
          <button class="perfil" data-perfil="experiencias">
            <img class="perfilAvatar" src="./assets/img/profile.png" alt="">
            <span class="perfilNome" data-i18n="perfil.exp">Experiências</span>
          </button>
        </div>
      </div>
    </section>

    <!--========== JAVASCRIPT ===========-->
    <script src="./assets/js/idioma.js"></script>
    <script src="./assets/js/controle.js"></script>
    <script src="./assets/js/perfis.js"></script>
  </body>
</html>
